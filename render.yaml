services:
  # 1. Telegram Worker Bot (Free Web Service on Render)
  - type: web
    name: boutique-worker-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: BOT_TOKEN
        sync: false
      - key: LOG_CHAT_ID
        value: -1004495225020

  # 2. Boutique Mirelle Marketplace (Free Web Service)
  - type: web
    name: boutique-marketplace
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: BOT_API_URL
        fromService:
          type: web
          name: boutique-worker-bot
          property: host
