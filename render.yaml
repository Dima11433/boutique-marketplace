services:
  # MODEVA Luxury Marketplace (Free Web Service)
  - type: web
    name: modeva-store
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
